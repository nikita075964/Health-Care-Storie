<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Health Stories</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <img src="./Images/logo.png" alt="LoGo"
        style="border-radius: 30%; height: 50px; width: 55px; padding-left: 5px;">
   
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="admin.html">Emergency Access</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h1>Sign Up</h1>
            <div class="form-container">
                <form id="signupForm" action="admin-signup.php" method="POST" onsubmit="return validateSignupForm()">
                    <!-- Dr. Name -->
                    <div class="form-group">
                        <label for="drName">Dr. Name:</label>
                        <input type="text" id="drName" name="drName" required>
                    </div>

                    <!-- Email ID -->
                    <div class="form-group">
                        <label for="email">Email ID:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <!-- Hospital Name -->
                    <div class="form-group">
                        <label for="hospitalName">Hospital Name:</label>
                        <input type="text" id="hospitalName" name="hospitalName" required>
                    </div>

                    <!-- Contact No -->
                    <div class="form-group">
                        <label for="contactNo">Contact No:</label>
                        <input type="tel" id="contactNo" name="contactNo" required>
                    </div>

                    <!-- Address -->
                    <div class="form-group">
                        <label for="address">Address:</label>
                        <textarea id="address" name="address" rows="3" required></textarea>
                    </div>

                    <!-- Aadhaar No -->
                    <div class="form-group">
                        <label for="aadhaarNo">Aadhaar No:</label>
                        <input type="text" id="aadhaarNo" name="aadhaarNo" required>
                    </div>

                    <!-- City -->
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" name="city" required>
                    </div>

                    <!-- Blood Group -->
                    <div class="form-group">
                        <label for="bloodGroup">Blood Group:</label>
                        <select id="bloodGroup" name="bloodGroup" required>
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn primary-btn">Sign Up</button>
                </form>

                <!-- Divider and Login Link -->
                <div class="form-divider">
                    <span>OR</span>
                </div>
                <div class="alternate-action">
                    <p>Already have an account?</p>
                    <a href="admin-login.html" class="btn secondary-btn">Login</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Health Stories</h3>
                <p>A globally accessible medical service platform</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="admin.html">Emergency</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Contact Us</h3>
                <p>Email: Healthstories@gmail.com</p>
                <p>College: ........</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Health Stories. All rights reserved.</p>
        </div>
    </footer>

    <script src="adminsignup.js"></script>
</body>
</html>
